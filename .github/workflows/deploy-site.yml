name: deploy craftrush.royashbrook.com

# The game deploys ITSELF now. It used to trigger a rebuild of royashbrook.com,
# whose build cloned this repo and shipped the result at /craftrush. That made two
# unrelated projects share a release: the site had to redeploy for a game change,
# and a game that failed to build could hold up the site. Its own origin ends both.
on:
  push:
    branches: [main]
    # CI config and docs don't change the built game, so they shouldn't burn a deploy.
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  # manual re-deploy, so a build can be reissued without a dummy commit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: craftrush-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # FULL history, no depth limit: the version is derived from the last tag plus
      # the commits since it (see appVersion() in svelte.config.js), and a shallow
      # clone has neither, so the build would stamp 0.0.0-dev and every client's
      # cache key would stop moving.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm test
      - run: npm run build
      # The version players read out is derived from git tags, and it is also the
      # cache key every client uses, so a build that quietly fell back to
      # 0.0.0-dev would freeze everyone's cache. Check the file the framework
      # actually writes, not the bundle: the fallback string also appears in a
      # sourcemap, so grepping build/ matches on a healthy build too.
      - name: check the build stamped a real version
        run: |
          test -f build/index.html
          test -f build/_app/version.json
          cat build/_app/version.json
          if grep -q '0\.0\.0-dev' build/_app/version.json; then
            echo "build stamped 0.0.0-dev: this checkout has no tags, refusing to deploy"
            exit 1
          fi
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set. add the repo secret to enable deploys."
            exit 1
          fi
          npx wrangler deploy

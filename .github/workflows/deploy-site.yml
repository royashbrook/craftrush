name: deploy craftrush.royashbrook.com

on:
  push:
    branches: [main]
  # Also used after the deliberately created vMAJOR.MINOR milestone tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: craftrush-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # A delayed event validates current main, never the event's old SHA.
          ref: main
          fetch-depth: 0
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: strict application types
        run: npm run check
      - name: rules, persistence and release contracts
        run: npm test
      # No development fallback: incomplete history, dirty input or a missing
      # eligible milestone stops this job before any publishing step.
      - name: build the release once
        run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: all browser projects against the release artifact
        id: browsers
        run: npx playwright test --forbid-only --retries=0 --workers=2 --reporter=line,json
        env:
          PW_TARGET: build
          PW_PREBUILT: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser-report.json
      - name: require executed passing coverage
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('test-results/browser-report.json', 'utf8'));
          for (const field of ['unexpected', 'flaky', 'skipped']) assert.equal(report.stats[field], 0, `browser ${field}`);
          assert.ok(report.stats.expected > 0, 'browser tests must actually run');
          NODE
      - name: verify exact release bytes and distribution notices
        run: node tools/release-artifact.mjs build
        env:
          CRAFTRUSH_EXPECTED_SOURCE: ${{ steps.source.outputs.sha }}
      - name: native legacy update and offline recovery
        run: node tools/verify-update.mjs --candidate build --evidence test-results/native-update
      - name: retain the validated artifact
        uses: actions/upload-artifact@v7
        with:
          name: validated-production
          path: build/
          if-no-files-found: error
          retention-days: 7
      - name: refuse a superseded release
        run: |
          git fetch origin main --no-tags
          node tools/release-artifact.mjs --current "$(git rev-parse HEAD)" "$(git rev-parse origin/main)" "$GITHUB_REF"
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRAFTRUSH_EXPECTED_SOURCE: ${{ steps.source.outputs.sha }}
        run: |
          node tools/release-artifact.mjs build
          npm exec --no -- wrangler deploy
      - name: verify production bytes and host headers
        run: node tools/release-live.mjs build https://craftrush.royashbrook.com/
      - name: retain browser evidence
        if: always() && steps.browsers.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
